spring:
  application:
    name: "FlixNet"
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://flixnet-db:5432/flixnet
    username: admin
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  management:
    endpoints:
      web:
        exposure:
          include: "health,metrics"
