services:
  db:
    image: postgres:latest
    container_name: flixnet-db
    environment:
      POSTGRES_DB: flixnet
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  app:
    build: .
    container_name: flixnet-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
